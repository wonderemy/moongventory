<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>moongventory</title>
<meta name="theme-color" content="#FBF7F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="moongventory">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
</head>
<body>
<style>
/* 그리운 몽토리체 — GRIUN(세히), 모든 사용 범위 자유·수정/판매 금지, griun.co.kr 배포 웹폰트 */
@font-face{font-family:"GriunMongtori";src:url(fonts/Griun_Mongtori-Rg.woff2) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
</style>
<style>
/* shadcn/ui default theme (zinc) */
:root{
  --background:36 45% 97%; --foreground:20 18% 20%;
  --card:0 0% 100%; --card-foreground:20 18% 20%;
  --muted:32 30% 93%; --muted-foreground:24 10% 52%;
  --primary:22 30% 28%; --primary-foreground:36 50% 97%;
  --secondary:30 60% 92%; --secondary-foreground:20 18% 20%;
  --accent:30 60% 92%; --accent-foreground:20 18% 20%;
  --destructive:12 78% 62%; --destructive-foreground:0 0% 100%;
  --border:30 25% 88%; --input:30 25% 84%; --ring:22 30% 28%;
  --radius:1.1rem;
  --shadow-sm:0 2px 10px 0 rgb(80 50 20 / .06);
  --peach:22 100% 88%; --mint:140 45% 88%; --sky:200 70% 90%; --butter:46 100% 86%; --pink:350 100% 92%; --lilac:262 60% 92%;
  /* 차트 시리즈(판매처) — 검증된 카테고리 팔레트 슬롯 1~3 */
  --s-kurly:#2a78d6; --s-naver:#eb6834; --s-coupang:#1baf7a; --s-other:#71717a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --background:24 18% 10%; --foreground:36 30% 92%;
    --card:24 16% 14%; --card-foreground:36 30% 92%;
    --muted:24 12% 20%; --muted-foreground:30 12% 64%;
    --primary:36 50% 92%; --primary-foreground:22 30% 16%;
    --secondary:24 14% 22%; --secondary-foreground:36 30% 92%;
    --accent:24 14% 22%; --accent-foreground:36 30% 92%;
    --destructive:12 70% 58%; --destructive-foreground:0 0% 100%;
    --border:24 12% 22%; --input:24 12% 26%; --ring:36 50% 80%;
    --shadow-sm:0 2px 10px 0 rgb(0 0 0 / .35);
    --peach:22 55% 34%; --mint:140 25% 28%; --sky:200 35% 30%; --butter:46 45% 32%; --pink:350 40% 34%; --lilac:262 25% 32%;
    --s-kurly:#3987e5; --s-naver:#d95926; --s-coupang:#199e70; --s-other:#a1a1aa;
  }
}
:root[data-theme="dark"]{

  --background:24 18% 10%; --foreground:36 30% 92%;
  --card:24 16% 14%; --card-foreground:36 30% 92%;
  --muted:24 12% 20%; --muted-foreground:30 12% 64%;
  --primary:36 50% 92%; --primary-foreground:22 30% 16%;
  --secondary:24 14% 22%; --secondary-foreground:36 30% 92%;
  --accent:24 14% 22%; --accent-foreground:36 30% 92%;
  --destructive:12 70% 58%; --destructive-foreground:0 0% 100%;
  --border:24 12% 22%; --input:24 12% 26%; --ring:36 50% 80%;
  --shadow-sm:0 2px 10px 0 rgb(0 0 0 / .35);
  --peach:22 55% 34%; --mint:140 25% 28%; --sky:200 35% 30%; --butter:46 45% 32%; --pink:350 40% 34%; --lilac:262 25% 32%;
  --s-kurly:#3987e5; --s-naver:#d95926; --s-coupang:#199e70; --s-other:#a1a1aa;
}
*{box-sizing:border-box;border-color:hsl(var(--border))}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:hsl(var(--background));color:hsl(var(--foreground));font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.5;word-break:keep-all;padding-inline:16px;padding-block:24px 40px;font-feature-settings:"cv11","ss01";font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.container{max-width:448px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-family:Fredoka,"Apple SD Gothic Neo",sans-serif;font-size:15px;font-weight:600;letter-spacing:.01em;line-height:1;color:hsl(var(--muted-foreground))}
h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-0.02em;line-height:1.2}
.date{font-family:"GriunMongtori",cursive;font-size:24px;font-weight:700;letter-spacing:0;color:hsl(var(--foreground));line-height:1.1}
/* Tabs */
.tabs{display:inline-flex;height:40px;align-items:center;justify-content:center;border-radius:calc(var(--radius) - 2px);background:hsl(var(--muted));padding:4px;color:hsl(var(--muted-foreground));width:fit-content}
.tab{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;border-radius:calc(var(--radius) - 4px);padding:6px 12px;font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;color:inherit;cursor:pointer;line-height:1.25}
.tab[aria-pressed="true"]{background:hsl(var(--background));color:hsl(var(--foreground));box-shadow:var(--shadow-sm)}
.tab.icon{padding:3px 10px;height:36px;border-radius:9999px}
.tabs.owners{background:none;padding:0;gap:8px;height:auto;width:100%;justify-content:flex-start;margin-left:-6px}
.tab.icon[aria-pressed="true"]{background:hsl(var(--muted));box-shadow:none}
.tab.icon img{display:block;width:28px;height:28px;object-fit:contain;opacity:.5;filter:grayscale(.4);transition:opacity .15s,filter .15s}
.tab.icon[aria-pressed="true"] img{opacity:1;filter:none}
/* 화면 탭: 밑줄 스타일, 스크롤 시 상단 고정 */
.views{position:sticky;top:0;z-index:5;display:flex;border-bottom:1px solid hsl(var(--border));background:hsl(var(--background));width:100%}
.vtab{flex:1;font:inherit;font-size:14px;font-weight:500;color:hsl(var(--muted-foreground));background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 0;cursor:pointer;line-height:1.25;transition:color .15s,border-color .15s}
.vtab:hover{color:hsl(var(--foreground))}
.vtab[aria-pressed="true"]{color:hsl(var(--foreground));border-bottom-color:hsl(var(--foreground))}
.vtab:focus-visible{outline:none;box-shadow:inset 0 0 0 2px hsl(var(--ring));border-radius:4px}
/* Alert */
.alert{position:relative;width:100%;border-radius:var(--radius);border:1px solid hsl(var(--destructive) / .5);padding:0 16px;color:hsl(var(--destructive))}
.alert-head{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 0;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.alert-title{font-size:14px;font-weight:500;letter-spacing:-0.01em;line-height:1}
.alert-sub{font-size:12px;color:hsl(var(--muted-foreground));margin-left:8px}
.alert .chev{color:hsl(var(--destructive));font-size:16px;line-height:1}
.alert-body{padding-bottom:16px}
.alert-head:focus-visible{outline:none;box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring));border-radius:4px}
.alert ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px;color:hsl(var(--foreground))}
.alert li{display:flex;justify-content:space-between;gap:12px}
.alert li .verdict{color:hsl(var(--muted-foreground));white-space:nowrap}
.alert li.put .verdict{color:hsl(var(--destructive));font-weight:500}
.alert .actions{margin-top:12px}
/* Card + rows */
.card{border-radius:var(--radius);border:1px solid hsl(var(--border));background:hsl(var(--card));color:hsl(var(--card-foreground));box-shadow:var(--shadow-sm);overflow:hidden}
.row+.row{border-top:1px solid hsl(var(--border))}
.row-head{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:12px 16px;width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
@media (hover:hover){.row-head:hover{background:hsl(var(--muted) / .5)}}
.row-head.simple{grid-template-columns:1fr auto}
.name{font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px;line-height:1.25}
.meta{color:hsl(var(--muted-foreground));font-size:12px;margin-top:2px;line-height:1.25}
.qty{text-align:right;line-height:1}
.qty b{font-size:18px;font-weight:600;letter-spacing:-0.01em}
.qty small{display:block;color:hsl(var(--muted-foreground));font-size:12px;margin-top:3px;font-weight:400}
.chev{color:hsl(var(--muted-foreground))}
/* Badge */
.badge{display:inline-flex;align-items:center;border-radius:9999px;border:1px solid transparent;padding:2px 10px;font-size:12px;font-weight:600;line-height:16px;white-space:nowrap}
.badge.default{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.badge.secondary{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground))}
.badge.destructive{background:hsl(var(--destructive));color:hsl(var(--destructive-foreground))}
.badge.outline{border-color:hsl(var(--border));color:hsl(var(--foreground))}
.badge.tag{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));padding:1px 6px;font-size:11px;font-weight:500}
/* Panel */
.panel{padding:12px 16px 16px;display:flex;flex-direction:column;gap:14px;background:hsl(var(--muted) / .4);border-top:1px solid hsl(var(--border))}
.label{font-size:14px;font-weight:500;line-height:1}
.field{display:flex;align-items:center;gap:8px}
.field .label{min-width:72px}
.stepper{display:inline-flex;align-items:center;gap:6px}
/* Inputs */
.input,select.input,textarea.input{display:flex;height:36px;width:100%;border-radius:calc(var(--radius) - 2px);border:1px solid hsl(var(--input));background:hsl(var(--background));padding:4px 12px;font:inherit;font-size:16px;color:hsl(var(--foreground));box-shadow:var(--shadow-sm);min-width:0}
.input:focus-visible,.btn:focus-visible,.tab:focus-visible,.row-head:focus-visible{outline:none;box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring))}
input.input[type="number"]{width:64px;text-align:center;-moz-appearance:textfield;padding:4px}
input.input.w{width:112px;text-align:right;padding:4px 10px}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
textarea.input{height:auto;min-height:72px;resize:vertical;font-size:14px;padding:8px 12px}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border-radius:calc(var(--radius) - 2px);font:inherit;font-size:14px;font-weight:500;height:36px;padding:0 16px;border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1;transition:background-color .15s,color .15s}
.btn.primary{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.btn.primary:hover{background:hsl(var(--primary) / .9)}
.btn.outline{border-color:hsl(var(--input));background:hsl(var(--background));color:hsl(var(--foreground));box-shadow:var(--shadow-sm)}
.btn.outline:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.btn.secondary{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground))}
.btn.ghost{background:transparent;color:hsl(var(--foreground))}
.btn.ghost:hover{background:hsl(var(--accent))}
.btn.destructive{background:hsl(var(--destructive));color:hsl(var(--destructive-foreground))}
.btn.icon{width:36px;padding:0;font-size:18px;font-weight:400}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions.end{justify-content:flex-end}
.spacer{flex:1}
/* Shop compare */
.shops{display:flex;flex-direction:column;gap:8px}
.shop{border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 2px);background:hsl(var(--card));padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;box-shadow:var(--shadow-sm)}
.shop.best{border-color:hsl(var(--foreground));box-shadow:0 0 0 1px hsl(var(--foreground))}
.shop .shop-name{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;line-height:1.25}
.shop .opts{grid-column:1 / -1;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:13px}
.shop .opts li{display:flex;justify-content:space-between;gap:8px}
.shop .opts li.cheapest{font-weight:600}
.shop .opts .per{color:hsl(var(--muted-foreground))}
.shop .opts li.cheapest .per{color:hsl(var(--foreground))}
.shop .note{grid-column:1 / -1;font-size:12px;color:hsl(var(--muted-foreground));line-height:1.35}
/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;padding:12px 16px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12px;color:hsl(var(--muted-foreground));line-height:1.25}
.stat .v{font-size:16px;font-weight:600;letter-spacing:-0.01em;line-height:1.25}
.stat .v small{font-size:12px;font-weight:400;color:hsl(var(--muted-foreground));margin-left:4px}
.stat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 0}
/* Charts */
.chart{position:relative;padding:4px 16px 8px}
.chart .ct{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px}
.chart .ct span{font-size:12px;color:hsl(var(--muted-foreground))}
.chart .ct b{font-size:12px;font-weight:500;color:hsl(var(--foreground))}
.chart svg{display:block;width:100%;height:auto;overflow:visible;font-family:inherit}
.chart .grid{stroke:hsl(var(--border));stroke-width:1}
.chart .axis{fill:hsl(var(--muted-foreground));font-size:10px}
.chart .avg{stroke:hsl(var(--muted-foreground));stroke-width:1}
.chart .avgl{fill:hsl(var(--muted-foreground));font-size:10px}
.chart .line{fill:none;stroke:hsl(var(--muted-foreground) / .55);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{stroke:hsl(var(--card));stroke-width:2;cursor:pointer}
.chart .dot.kurly{fill:var(--s-kurly)}.chart .dot.naver{fill:var(--s-naver)}.chart .dot.coupang{fill:var(--s-coupang)}.chart .dot.other{fill:var(--s-other)}
.chart .bar{fill:var(--s-kurly);cursor:pointer}
.chart .val{fill:hsl(var(--foreground));font-size:10px;font-weight:500}
.chart .hit{fill:transparent;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:hsl(var(--muted-foreground));margin-top:2px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.legend i.kurly{background:var(--s-kurly)}.legend i.naver{background:var(--s-naver)}.legend i.coupang{background:var(--s-coupang)}.legend i.other{background:var(--s-other)}
.tip{position:absolute;z-index:2;pointer-events:none;background:hsl(var(--primary));color:hsl(var(--primary-foreground));font-size:12px;line-height:1.35;padding:6px 8px;border-radius:6px;box-shadow:0 4px 12px rgb(0 0 0 / .15);white-space:nowrap;transform:translate(-50%,calc(-100% - 10px))}
.buys{list-style:none;margin:0;padding:0 16px 12px;font-size:12px;color:hsl(var(--muted-foreground));display:flex;flex-direction:column;gap:2px}
.buys li{display:flex;justify-content:space-between;gap:8px}
.buys em{font-style:normal;color:hsl(var(--muted-foreground) / .8)}
.buys b{font-weight:600;color:hsl(var(--muted-foreground))}
.buys b.up,.stat .v.up small{color:hsl(var(--destructive))}
.buys b.down,.stat .v.down small{color:hsl(142 71% 29%)}
:root[data-theme="dark"] .buys b.down,:root[data-theme="dark"] .stat .v.down small{color:hsl(142 60% 55%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .buys b.down,:root:not([data-theme="light"]) .stat .v.down small{color:hsl(142 60% 55%)}}
.form{display:grid;grid-template-columns:1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:8px;flex:1}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;margin:0;accent-color:hsl(var(--primary))}
.form .field .label{min-width:96px}
.hint{font-size:12px;color:hsl(var(--muted-foreground));white-space:nowrap}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.empty{padding:24px 16px;text-align:center;color:hsl(var(--muted-foreground));font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:hsl(var(--primary));color:hsl(var(--primary-foreground));padding:10px 16px;border-radius:calc(var(--radius) - 2px);font-size:14px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);white-space:nowrap;box-shadow:0 4px 12px rgb(0 0 0 / .15)}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast,.btn{transition:none}}
/* ===== concept: soft paper & pastel ===== */
body{background:hsl(var(--background))}
.card{border:0;border-radius:20px;box-shadow:var(--shadow-sm)}
.row+.row{border-top:1px solid hsl(var(--border) / .7)}
.row-head{padding:14px 16px}
.row-head:hover{background:hsl(var(--muted) / .6)}
.name{font-weight:600}
.qty b{font-size:20px;font-weight:700}
.badge{padding:3px 11px;font-weight:600;border:0}
.badge.destructive{background:hsl(var(--peach));color:hsl(12 60% 30%)}
.badge.default{background:hsl(var(--butter));color:hsl(40 60% 24%)}
.badge.secondary{background:hsl(var(--mint));color:hsl(150 40% 22%)}
.badge.outline{background:hsl(var(--lilac));color:hsl(262 35% 32%)}
.badge.tag{background:hsl(var(--sky));color:hsl(205 45% 28%)}
:root[data-theme="dark"] .badge.destructive,:root[data-theme="dark"] .badge.default,:root[data-theme="dark"] .badge.secondary,:root[data-theme="dark"] .badge.outline,:root[data-theme="dark"] .badge.tag{color:hsl(var(--foreground))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.destructive,:root:not([data-theme="light"]) .badge.default,:root:not([data-theme="light"]) .badge.secondary,:root:not([data-theme="light"]) .badge.outline,:root:not([data-theme="light"]) .badge.tag{color:hsl(var(--foreground))}}
.btn{border-radius:9999px;height:38px;padding:0 18px;font-weight:600}
.btn.sm{height:32px;padding:0 14px}
.btn.icon{width:38px;padding:0;border-radius:9999px}
.btn.outline{border-color:hsl(var(--border));box-shadow:none;background:hsl(var(--card))}
.btn.primary{box-shadow:0 4px 12px rgb(60 40 20 / .18)}
.input,select.input,textarea.input{border-radius:12px;border-color:hsl(var(--input));box-shadow:none;background:hsl(var(--card))}
input.input[type="number"]{border-radius:12px}
.panel{background:hsl(var(--muted) / .5);border-top:1px solid hsl(var(--border) / .7)}
.alert{border:0;border-radius:20px;background:hsl(var(--peach));color:hsl(var(--foreground));padding:0 18px}
.alert-title{color:hsl(12 60% 30%)}
.alert .chev{color:hsl(12 60% 30%)}
.alert li.put .verdict{color:hsl(12 70% 38%)}
.alert-sub{color:hsl(12 30% 40%)}
.views{border-bottom-color:hsl(var(--border))}
.vtab{font-weight:600}
.vtab[aria-pressed="true"]{border-bottom-color:hsl(var(--primary))}
.tab.icon[aria-pressed="true"]{background:hsl(var(--butter))}
.tabs:not(.owners){background:hsl(var(--muted));border-radius:9999px}
.tabs:not(.owners) .tab{border-radius:9999px}
.tabs:not(.owners) .tab[aria-pressed="true"]{background:hsl(var(--card));color:hsl(var(--foreground));box-shadow:var(--shadow-sm)}
.stat-grid{gap:10px;padding:12px 14px}
.stat{border-radius:16px;padding:12px 14px;gap:4px}
.stat:nth-child(1){background:hsl(var(--sky))}
.stat:nth-child(2){background:hsl(var(--peach))}
.stat:nth-child(3){background:hsl(var(--mint))}
.stat:nth-child(4){background:hsl(var(--butter))}
.stat .k{color:hsl(var(--foreground) / .65)}
.stat .v small{color:hsl(var(--foreground) / .6)}

  let buyBy = null; try { buyBy = localStorage.getItem('pantry.me') || null; } catch(e){}   // 뭉이 것 누가 샀는지(기기별 기억)
  let roundOpen = false;    // 컬리 회차 카드는 접힌 채로 시작
  let statsMode = 'text';   // 통계 보기: 'text' | 'chart'
  try { statsMode = localStorage.getItem('pantry.statsMode') || 'text'; } catch(e){}
  document.querySelectorAll('.tab[data-smode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.smode === statsMode)));

  try { owner = localStorage.getItem('pantry.owner') || 'all'; } catch(e){}
  document.querySelectorAll('.tab').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.owner === owner)));

  // ---------- storage (Supabase) ----------
  const LS_KEY = 'pantry.items';
  function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch(e){ return []; } }
  function lsSave(){ try { localStorage.setItem(LS_KEY, JSON.stringify(items)); } catch(e){} }
  let sb = null;
  async function loadAll(){
    const [a, b] = await Promise.all([sb.from('items').select('id,data'), sb.from('prices').select('id,data')]);
    if (a.error) throw a.error; if (b.error) throw b.error;
    items = (a.data || []).map(r => ({id: r.id, ...r.data}));
    prices = {}; (b.data || []).forEach(r => { prices[r.id] = r.data; });
    lsSave(); render();
  }
  async function save(id, doc){
    const i = items.findIndex(x => x.id === id);
    if (i >= 0) items[i] = {id, ...doc}; else items.push({id, ...doc});
    lsSave(); render();
    if (sb){ const {error} = await sb.from('items').upsert({id, data: doc, updated_at: new Date().toISOString()}); if (error) throw error; }
  }
  async function create(doc){
    const id = 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await save(id, doc);
  }
  async function remove(id){
    items = items.filter(x => x.id !== id); lsSave(); render();
    if (sb){ const {error} = await sb.from('items').delete().eq('id', id); if (error) throw error; }
  }

  // ---------- math ----------
  function estimate(it, now){
    if (it.baseQty == null || !it.baseAt) return null;
    const days = Math.max(0, (now - Date.parse(it.baseAt)) / DAY);
    const rate = Number(it.dailyRate) || 0;
    const est = Math.max(0, it.baseQty - days * rate);
    const daysLeft = rate > 0 ? est / rate : Infinity;
    return {est, daysLeft, days};
  }
  function statusOf(it, now){
    const e = estimate(it, now);
    if (!e) return 'count';
    const lead = Number(it.leadDays) || 3;
    if (e.daysLeft <= lead) return 'order';
    if (e.daysLeft <= lead + 4) return 'soon';
    return 'ok';
  }
  const RANK = {count:0, order:1, soon:2, ok:3};
  const LABEL = {count:'수량 입력', order:'주문', soon:'곧 주문', ok:'여유'};
  const BADGE = {count:'outline', order:'destructive', soon:'default', ok:'secondary'};

  function fmtQty(n){ return String(Math.round(n)); }
  function fmtRate(n){ return (Math.round(n*100)/100).toString(); }
  function fmtDays(d){ if (!isFinite(d)) return '—'; return Math.floor(d) + '일'; }
  function fmtDate(iso){ const d = new Date(iso); return (d.getMonth()+1) + '/' + d.getDate(); }
  function fmtWon(n){ return Math.round(n).toLocaleString('ko-KR') + '원'; }
  function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function dateAtNoon(iso){ const [y, m, d] = iso.split('-').map(Number); return new Date(y, m-1, d, 12, 0, 0).getTime(); }
  function fmtEvery(days){
    if (!days || !isFinite(days) || days < 1) return null;
    if (days < 10) return Math.round(days) + '일마다';
    if (days < 50) return '약 ' + Math.round(days / 7) + '주마다';
    return '약 ' + (Math.round(days / 30 * 2) / 2) + '개월마다';
  }
  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function buysOf(it){ return (it.history || []).filter(h => h.type === 'buy').slice().sort((a,b) => Date.parse(a.at) - Date.parse(b.at)); }
  function statsOf(it){
    const buys = buysOf(it);
    const s = { count: buys.length, last: buys.length ? buys[buys.length-1] : null, every: null, avgPer: null, lastPer: null, avgQty: null, avgPrice: null };
    if (buys.length >= 2){
      // 같은 날 두 번 산 것(간격 1일 미만)은 "얼마나 자주"에서 뺀다.
      const gaps = []; for (let i = 1; i < buys.length; i++){ const g = (Date.parse(buys[i].at) - Date.parse(buys[i-1].at)) / DAY; if (g >= 1) gaps.push(g); }
      if (gaps.length) s.every = gaps.reduce((a, b) => a + b, 0) / gaps.length;
    }
    const priced = buys.filter(b => b.price > 0 && b.qty > 0);
    if (priced.length){
      s.avgPrice = priced.reduce((a, b) => a + b.price, 0) / priced.length;
      s.avgPer = priced.reduce((a, b) => a + b.price / b.qty, 0) / priced.length;
      const lp = priced[priced.length-1]; s.lastPer = lp.price / lp.qty; s.lastPrice = lp.price; s.lastShop = lp.shop;
    }
    const q = buys.filter(b => b.qty > 0);
    if (q.length) s.avgQty = q.reduce((a, b) => a + b.qty, 0) / q.length;
    return s;
  }
  function shopOf(url){ if (/kurly\.com/i.test(url)) return 'kurly'; if (/naver\.com/i.test(url)) return 'naver'; if (/coupang\.com/i.test(url)) return 'coupang'; return null; }
  function shopKeys(it){
    if (Array.isArray(it.shops) && it.shops.length) return it.shops.filter(k => SHOP_KEYS.includes(k));
    return it.shop === 'kurly' ? ['kurly'] : it.shop === 'smartstore' ? ['naver'] : ['kurly', 'naver'];
  }
  function shopLabel(it){ return shopKeys(it).map(k => SHOP_NAME[k]).join('·') || '판매처 없음'; }
  function shopsFor(it){
    return shopKeys(it).map(shop => {
      const c = (it.candidates || []).find(x => x.url && shopOf(x.url) === shop);
      return { shop, url: c ? c.url : SHOP_HOME[shop] };
    });
  }
  function bestOption(it){
    const p = prices[it.id] || {};
    let best = null;
    shopsFor(it).forEach(s => ((p[s.shop] && p[s.shop].options) || []).forEach(o => {
      if (o.price && o.count){ const per = o.price / o.count; if (!best || per < best.per) best = {shop: s.shop, per, label: o.label, price: o.price, count: o.count}; }
    }));
    return best;
  }
  function cheapestIn(it, shop){
    const q = (prices[it.id] || {})[shop];
    let best = null;
    ((q && q.options) || []).forEach(o => { if (o.price && o.count){ const per = o.price / o.count; if (!best || per < best.per) best = {per, price: o.price, count: o.count, label: o.label}; } });
    return best;
  }
  function naverAppUrl(web){ return 'naversearchapp://inappbrowser?url=' + encodeURIComponent(web) + '&target=new&version=6'; }
  function faceImg(owner){
    if (!OWNER[owner]) return '';
    const img = document.querySelector('.tab.icon[data-owner="' + owner + '"] img');
    return img ? `<img class="face" src="${img.src}" alt="${OWNER[owner]}" title="${OWNER[owner]}" width="26" height="26">` : `<span class="badge tag">${OWNER[owner]}</span>`;
  }
  function josa(word, a, b){ const c = (word || '').slice(-1).charCodeAt(0); const has = c >= 0xAC00 && c <= 0xD7A3 && ((c - 0xAC00) % 28) !== 0; return word + (has ? a : b); }
  function rateText(it){
    const u = it.unit || '개';
    if (it.rateMode === 'daysPer' && it.daysPer) return `한 ${u}에 ${fmtRate(it.daysPer)}일`;
    return `하루 ${fmtRate(Number(it.dailyRate) || 0)}${u}`;
  }

  // ---------- render ----------
  function render(){
    const now = Date.now();
    { const d = new Date(now); const wd = ['일','월','화','수','목','금','토'][d.getDay()]; stampEl.textContent = String(d.getMonth()+1).padStart(2,'0') + '월 ' + String(d.getDate()).padStart(2,'0') + '일 ' + wd + '요일'; }
    $('#view-stock').hidden = view !== 'stock';
    $('#view-buy').hidden = view !== 'buy';
    $('#view-stats').hidden = view !== 'stats';
    $('#view-settings').hidden = view !== 'settings';
    const ow = $('#owners'); if (ow) ow.hidden = view === 'stats';
    // 설정 > 품목 편집: 앱 헤더를 페이지 헤더로 교체
    const editing = view === 'settings' && (mode === 'edit' || mode === 'field') && items.some(x => x.id === openId);
    $('#apphead').hidden = editing; document.querySelector('.date-row').hidden = editing; document.querySelector('.views').hidden = editing;
    $('#pagehead').hidden = !editing;
    if (editing) $('#pagehead-title').textContent = (editDraft && editDraft.name) || (items.find(x => x.id === openId) || {}).name || '';
    document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
    if (view === 'stock') renderStock(now);
    else if (view === 'buy') renderBuyPage(now);
    else if (view === 'stats') renderStats(now);
    else renderSettings(now);
    // 바텀 시트: 수량/구매(quick·buy) · 품목 추가(new, 단계형) · 필드 편집(field)
    const sheet = $('#sheet');
    $('#sheet-aside').innerHTML = '';
    const cur = items.find(x => x.id === openId);
    if (mode === 'quick' || mode === 'buy'){
      if (!cur){ mode = null; sheet.hidden = true; document.body.style.overflow = ''; }
      else {
        $('#sheet-title').textContent = cur.name;
        $('#sheet-body').innerHTML = mode === 'buy' ? renderBuy(cur, estimate(cur, now)) : renderQuick(cur, estimate(cur, now));
        sheet.hidden = false; document.body.style.overflow = 'hidden';
      }
    } else if (mode === 'new'){
      $('#sheet-title').textContent = '품목 추가';
      $('#sheet-aside').innerHTML = `<div class="dots">${[1,2,3,4,5].map(i => `<i class="${i === newStep ? 'on' : ''}"></i>`).join('')}</div>`;
      $('#sheet-body').innerHTML = renderNewStep();
      sheet.hidden = false; document.body.style.overflow = 'hidden';
    } else if (mode === 'field' && cur){
      $('#sheet-title').textContent = FIELD_LABEL[fieldKey] || '수정';
      $('#sheet-body').innerHTML = renderField({id: cur.id, ...(editDraft || clean(cur))}, fieldKey);
      sheet.hidden = false; document.body.style.overflow = 'hidden';
    } else { sheet.hidden = true; document.body.style.overflow = ''; }
    const focusEl = document.querySelector('[data-autofocus]');
    if (focusEl) focusEl.focus({preventScroll:false});
  }

  function sortedVisible(now, filterOwner){
    return items
      .filter(it => !filterOwner || owner === 'all' || (it.owner || 'me') === owner)
      .map(it => ({it, e: estimate(it, now), st: statusOf(it, now)}))
      .sort((a, b) => (RANK[a.st] - RANK[b.st]) || ((a.e ? a.e.daysLeft : 0) - (b.e ? b.e.daysLeft : 0)) || (a.it.name || '').localeCompare(b.it.name || ''));
  }

  function renderStock(now){
    renderRound(now);
    listEl.className = 'tiles';
    let html = '';
    for (const {it, e, st} of sortedVisible(now, true)){
      const s = statsOf(it);
      const unit = esc(it.unit || '개');
      const metaBits = [];
      if (e) metaBits.push(e.est <= 0 ? '다 떨어짐' : fmtDays(e.daysLeft) + ' 남음'); else metaBits.push('수량을 입력해 주세요');
      metaBits.push(s.last ? '최근 ' + fmtDate(s.last.at) + (s.last.by && OWNER[s.last.by] ? ' ' + OWNER[s.last.by] : '') : '구매 기록 없음');
      // 막대 = 남은 양 / 기준량(최근 구매 수량 또는 기준 수량)
      let pct = 0;
      if (e){ const ref = Math.max(e.est, (s.last && s.last.qty) || it.baseQty || 1); pct = Math.max(0, Math.min(100, Math.round(e.est / ref * 100))); }
      // 카드 = 수량 고치기 시트. 구매는 '구매' 탭에서.
      html += `<div class="tile" data-id="${it.id}">
        <button class="tile-head" type="button" data-act="toggle">
          <div class="t"><span class="name">${esc(it.name)}</span>${faceImg(it.owner)}</div>
          <div class="big-row"><div class="big">${e ? fmtQty(e.est) : '—'}<small>${e ? unit : ''}</small></div>${(st === 'order' || st === 'soon') ? `<span class="badge ${BADGE[st]}">${LABEL[st]}</span>` : ''}</div>
          <div class="bar"><i class="f-${st}" style="width:${pct}%"></i></div>
          <div class="meta">${metaBits.join(' · ')}</div>
        </button>
      </div>`;
    }
    if (!html) html = `<div class="empty" style="grid-column:1/-1">표시할 품목이 없습니다.</div>`;
    listEl.innerHTML = html;
  }

  // 구매 탭: 주문할 것부터 위로. 누르면 '샀어요' 폼
  function renderBuyPage(now){
    let html = '';
    for (const {it, st} of sortedVisible(now, true)){
      const s = statsOf(it);
      const sub = s.last
        ? '최근 ' + fmtDate(s.last.at) + ' · ' + (SHOP_NAME[s.last.shop] || '기타') + (s.last.price ? ' · ' + fmtWon(s.last.price) : '') + (s.last.by && OWNER[s.last.by] ? ' · ' + OWNER[s.last.by] : '')
        : '구매 기록 없음';
      html += `<div class="row" data-id="${it.id}">
        <button class="row-head simple" type="button" data-act="toggle">
          <div>
            <div class="name">${esc(it.name)}${faceImg(it.owner)}</div>
            <div class="meta">${sub}</div>
          </div>
          <span class="right">${(st === 'order' || st === 'soon') ? `<span class="badge ${BADGE[st]}">${LABEL[st]}</span>` : ''}<span class="chev">›</span></span>
        </button>
      </div>`;
    }
    if (!html) html = `<div class="empty">표시할 품목이 없습니다.</div>`;
    buyEl.innerHTML = html;
  }

  function renderQuick(it, e){
    const guess = e ? Math.round(e.est) : 0;
    const unit = esc(it.unit || '개');
    return `<div class="sform">
      <div class="fg"><span class="fl">현재 수량 <em>${e ? '추정 ' + fmtQty(e.est) + unit : '아직 없음'}</em></span>
        <div class="stepper2"><button class="stp" type="button" data-act="step" data-target="#cnt-${it.id}" data-delta="-1" aria-label="하나 빼기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 12.1c4-.2 8-.2 12 0"/></svg></button><input class="input fi" type="number" inputmode="numeric" id="cnt-${it.id}" value="${guess}" min="0" step="1"><button class="stp" type="button" data-act="step" data-target="#cnt-${it.id}" data-delta="1" aria-label="하나 더하기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 6c.15 4 .15 8 0 12"/><path d="M6 12.1c4-.2 8-.2 12 0"/></svg></button></div>
      </div>
      <div class="fbtn"><button class="btn outline" type="button" data-act="cancel">취소</button><button class="btn primary" type="button" data-act="count-save">저장</button></div>
    </div>`;
  }

  function shopCards(it){
    const p = prices[it.id] || {};
    const best = bestOption(it);
    const unit = it.unit || '개';
    return shopsFor(it).map(s => {
      const q = p[s.shop] || {};
      const opts = (q.options || []).map(o => {
        const per = o.price && o.count ? o.price / o.count : null;
        const isBest = best && best.shop === s.shop && best.label === o.label;
        return `<li class="${isBest ? 'cheapest' : ''}"><span>${esc(o.label)} · ${fmtWon(o.price)}</span><span class="per">${per ? unit + '당 ' + fmtWon(per) : ''}</span></li>`;
      }).join('');
      const url = (q.options && q.options[0] && q.options[0].url) || s.url;
      const href = s.shop === 'naver' && IOS ? naverAppUrl(url) : url;
      const note = q.options && q.options.length
        ? `${q.ship ? '배송 ' + esc(q.ship) : ''}${p.at ? (q.ship ? ' · ' : '') + fmtDate(p.at) + ' 기준' : ''}`
        : '가격 미확인';
      const isBestShop = best && best.shop === s.shop;
      return `<div class="shop ${isBestShop ? 'best' : ''}">
        <div class="shop-name">${SHOP_NAME[s.shop]}${isBestShop ? '<span class="badge default">최저</span>' : ''}</div>
        <a class="btn ${isBestShop ? 'primary' : 'outline'} sm" href="${esc(href)}" data-web="${esc(url)}" data-shop="${s.shop}" target="_blank" rel="noopener">열기</a>
        ${opts ? `<ul class="opts">${opts}</ul>` : ''}
        <div class="note">${note}</div>
      </div>`;
    }).join('');
  }

  function recommendText(it){
    const p = prices[it.id] || {}; const shops = shopsFor(it); const unit = it.unit || '개';
    const priced = shops.filter(sh => (p[sh.shop] && p[sh.shop].options || []).some(o => o.price && o.count));
    const best = bestOption(it);
    if (!best) return { text: '가격을 아직 몰라요. 링크로 직접 확인해 보세요.', cls: '' };
    if (priced.length === 1) return { text: `${SHOP_NAME[best.shop]} 가격만 알아요 · ${unit}당 ${fmtWon(best.per)}`, cls: '' };
    return { text: `${josa(SHOP_NAME[best.shop], '이', '가')} 더 싸요 · ${unit}당 ${fmtWon(best.per)}`, cls: 'good' };
  }
  function renderBuy(it, e){
    const unit = esc(it.unit || '개');
    const best = bestOption(it);
    const shops = shopsFor(it).map(s => s.shop);
    const defShop = best ? best.shop : shops[0];
    const def = best || cheapestIn(it, defShop) || {};
    const seg = `<div class="seg" style="margin-bottom:12px"><button class="segb ${buyTab === 'where' ? 'on' : ''}" type="button" data-act="buytab" data-val="where">어디서 살까</button><button class="segb ${buyTab === 'done' ? 'on' : ''}" type="button" data-act="buytab" data-val="done">샀어요</button></div>`;
    if (buyTab === 'where'){
      const r = recommendText(it);
      return `<div class="sform">${seg}
        <p class="reco ${r.cls}">${r.text}</p>
        <div class="shops">${shopCards(it)}</div>
        ${(it.candidates || []).some(c => c.url) && typeof window.__fetchPrice === 'function' ? `<button class="btn outline" type="button" data-act="price-check" id="price-check"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.6 12.2a7.6 7.6 0 1 1-2.2-5.5"/><path d="M19.8 4.4v4.3h-4.3"/></svg><span>지금 가격 확인</span></button><p class="meta" id="price-msg" style="text-align:center;margin:-6px 0 0"></p>` : ''}
        <div class="fbtn"><button class="btn outline" type="button" data-act="cancel">닫기</button></div>
      </div>`;
    }
    return `<div class="sform">${seg}
      ${buyForm(it, defShop, def)}
      <div class="fbtn"><button class="btn outline" type="button" data-act="cancel">취소</button><button class="btn primary" type="button" data-act="buy-save">기록</button></div>
    </div>`;
  }
  // 샀어요 폼(구매 시트 · 품목 추가 5단계 공용). it은 저장된 품목이거나 추가 초안(owner·shops·unit만 있으면 됨)
  function buyForm(it, defShop, def){
    def = def || {};
    return `<div class="form">
        <div class="field"><label class="label" for="b-shop">어디서<i class="req">*</i></label><select class="input" id="b-shop">
          ${SHOP_KEYS.map(sh => `<option value="${sh}" ${sh === defShop ? 'selected' : ''}>${SHOP_NAME[sh]}</option>`).join('')}
          <option value="other">기타</option>
        </select></div>
        ${it.owner === 'mung' ? `<div class="field" style="align-items:flex-start"><span class="label" style="padding-top:8px">누가<i class="req">*</i></span><div class="faces small" id="b-by">${['mom','dad'].map(k => `<button class="face-pick ${(buyBy || '') === k ? 'on' : ''}" type="button" data-act="pickby" data-val="${k}" aria-pressed="${(buyBy || '') === k}"><img src="${(document.querySelector('.tab.icon[data-owner=' + k + '] img') || {}).src || ''}" alt="${OWNER[k]}"><span>${OWNER[k]}</span></button>`).join('')}</div></div>` : ''}
        <div class="field"><label class="label" for="b-date">언제<i class="req">*</i></label><input class="input" type="date" id="b-date" value="${todayISO()}" max="${todayISO()}"></div>
        <div class="field"><label class="label" for="b-qty">몇 개<i class="req">*</i></label><input class="input" type="number" inputmode="numeric" id="b-qty" value="${def.count || ''}" min="1" step="1" placeholder="0"></div>
        <div class="field"><label class="label" for="b-price">얼마</label><input class="input" type="number" inputmode="numeric" id="b-price" value="${def.price || ''}" min="0" step="10" placeholder="0"></div>
      </div>`;
  }
  // 샀어요 폼 읽기. 문제가 있으면 안내하고 null
  function readBuyForm(ownerKey, now){
    const qty = Number($('#b-qty').value); if (!(qty > 0)){ $('#b-qty').focus(); return null; }
    const by = ownerKey === 'mung' ? buyBy : null;
    if (ownerKey === 'mung' && !by){ toast('누가 샀는지 골라 주세요'); return null; }
    const price = Number($('#b-price').value) || 0; const shop = $('#b-shop').value;
    const dv = $('#b-date').value; const boughtAt = dv ? dateAtNoon(dv) : now;
    return { qty, price, shop, boughtAt, by };
  }

  function renderRound(now){
    const kurly = items.filter(it => { if (!shopKeys(it).includes('kurly')) return false; const b = bestOption(it); return !b || b.shop === 'kurly'; })
      .map(it => ({it, e: estimate(it, now), st: statusOf(it, now)}));
    const trigger = kurly.some(k => k.st === 'order');
    if (!trigger){ roundEl.hidden = true; roundEl.innerHTML = ''; return; }
    const lines = kurly.filter(k => k.e).sort((a,b) => a.e.daysLeft - b.e.daysLeft).map(k => {
      const lead = Number(k.it.leadDays) || 3;
      let cls = '', verdict = '이번엔 안 넣어도 됩니다';
      if (k.st === 'order'){ cls = 'put'; verdict = '넣기'; }
      else if (k.e.daysLeft <= lead + 10){ verdict = '앞당겨 넣기'; }
      return `<li class="${cls}"><span>${esc(k.it.name)} · ${fmtDays(k.e.daysLeft)} 남음</span><span class="verdict">${verdict}</span></li>`;
    }).join('');
    const putCount = kurly.filter(k => k.st === 'order').length;
    roundEl.className = 'alert' + (roundOpen ? ' open' : '');
    roundEl.innerHTML = `<button class="alert-head" type="button" data-act="round-toggle" aria-expanded="${roundOpen}">
        <span><span class="alert-title">컬리에서 한번에 장볼까요?</span><span class="alert-sub">넣을 것 ${putCount}개</span></span>
        <span class="chev ${roundOpen ? 'open' : ''}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.2 9.6c1.9 2 3.7 4.1 5.7 5.9 2-1.9 3.9-3.9 5.9-5.8"/></svg></span>
      </button>
      <div class="alert-body" ${roundOpen ? '' : 'hidden'}><ul>${lines}</ul>
      <div class="actions"><a class="btn primary block" href="${SHOP_HOME.kurly}" target="_blank" rel="noopener">컬리 열기</a></div></div>`;
    roundEl.hidden = false;
  }

  // ---------- charts (inline SVG) ----------
  function niceTicks(lo, hi, n){
    if (!(hi > lo)) { hi = lo + 1; }
    const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
    const start = Math.floor(lo / step) * step, end = Math.ceil(hi / step) * step;
    const ticks = []; for (let v = start; v <= end + step / 2; v += step) ticks.push(Math.round(v * 1000) / 1000);
    return {ticks, lo: start, hi: end};
  }
  function fmtK(n){ return n >= 10000 ? (Math.round(n / 100) / 10).toLocaleString('ko-KR') + '만' : Math.round(n).toLocaleString('ko-KR'); }
  const shopCls = s => (s === 'kurly' || s === 'naver' || s === 'coupang') ? s : 'other';

  // 개당 단가 추이 — 가격이 있는 구매 2건부터
  function priceChart(rows, unit, avgPer){
    const pts = rows.filter(r => r.per).map(r => ({t: Date.parse(r.b.at), y: r.per, r}));
    if (pts.length < 2) return '';
    const W = 360, H = 140, L = 46, R = 14, T = 14, B = 24;
    const t0 = pts[0].t, t1 = pts[pts.length-1].t, tspan = Math.max(1, t1 - t0);
    const ys = pts.map(p => p.y).concat([avgPer]);
    const {ticks, lo, hi} = niceTicks(Math.min(...ys) * 0.95, Math.max(...ys) * 1.05, 3);
    const X = t => L + (t - t0) / tspan * (W - L - R);
    const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const grid = ticks.map(v => `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="axis" x="${L-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${fmtK(v)}</text>`).join('');
    const path = pts.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
    const dots = pts.map(p => `<circle class="dot ${shopCls(p.r.b.shop)}" cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4.5" data-tip="${fmtDate(p.r.b.at)} · ${SHOP_NAME[p.r.b.shop] || '—'}&#10;${unit}당 ${fmtWon(p.y)} · ${fmtQty(p.r.b.qty)}${unit} ${fmtWon(p.r.b.price)}"/><circle class="hit" cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="14" data-tip="${fmtDate(p.r.b.at)} · ${SHOP_NAME[p.r.b.shop] || '—'}&#10;${unit}당 ${fmtWon(p.y)} · ${fmtQty(p.r.b.qty)}${unit} ${fmtWon(p.r.b.price)}"/>`).join('');
    const last = pts[pts.length-1];
    const endLabel = `<text class="val" x="${(X(last.t) - 8).toFixed(1)}" y="${(Y(last.y) - 9).toFixed(1)}" text-anchor="end">${fmtWon(last.y)}</text>`;
    const avg = `<line class="avg" x1="${L}" x2="${W-R}" y1="${Y(avgPer).toFixed(1)}" y2="${Y(avgPer).toFixed(1)}"/>`;
    const xl = `<text class="axis" x="${L}" y="${H-6}">${fmtDate(pts[0].r.b.at)}</text><text class="axis" x="${W-R}" y="${H-6}" text-anchor="end">${fmtDate(last.r.b.at)}</text>`;
    const shops = [...new Set(pts.map(p => shopCls(p.r.b.shop)))];
    const legend = shops.length >= 2 ? `<div class="legend">${shops.map(s => `<span><i class="${s}"></i>${SHOP_NAME[s] || '기타'}</span>`).join('')}</div>` : '';
    return `<div class="chart"><div class="ct"><b>${esc(unit)}당 단가</b><span>평균선 ${fmtWon(avgPer)} · 구매 ${pts.length}회</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)}당 단가 추이">${grid}${avg}<path class="line" d="${path}"/>${dots}${endLabel}${xl}</svg>${legend}</div>`;
  }

  // 구매 간격 — 간격이 1일 이상인 구매 2건부터
  function gapChart(rows, avgEvery){
    const gaps = rows.filter(r => r.gap != null && r.gap >= 1).map(r => ({d: Math.round(r.gap), r}));
    if (gaps.length < 1) return '';
    const W = 360, H = 120, L = 30, R = 14, T = 16, B = 24;
    const {ticks, hi} = niceTicks(0, Math.max(...gaps.map(g => g.d), avgEvery || 0) * 1.15, 3);
    const Y = v => T + (1 - v / hi) * (H - T - B);
    const slot = (W - L - R) / gaps.length, bw = Math.min(24, slot * 0.6);
    const grid = ticks.map(v => `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="axis" x="${L-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${v}</text>`).join('');
    const bars = gaps.map((g, i) => {
      const x = L + slot * i + (slot - bw) / 2, y = Y(g.d), h = Math.max(0, Y(0) - y), rr = Math.min(4, h / 2);
      const tip = `${fmtDate(g.r.b.at)} 구매&#10;이전 구매 뒤 ${g.d}일 만에`;
      return `<path class="bar" d="M${x.toFixed(1)} ${Y(0).toFixed(1)} V${(y + rr).toFixed(1)} a${rr} ${rr} 0 0 1 ${rr} -${rr} h${(bw - 2*rr).toFixed(1)} a${rr} ${rr} 0 0 1 ${rr} ${rr} V${Y(0).toFixed(1)} Z" data-tip="${tip}"/>
        <rect class="hit" x="${(x - 6).toFixed(1)}" y="${T}" width="${(bw + 12).toFixed(1)}" height="${(H - T - B).toFixed(1)}" data-tip="${tip}"/>
        <text class="val" x="${(x + bw/2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle">${g.d}일</text>
        <text class="axis" x="${(x + bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${fmtDate(g.r.b.at)}</text>`;
    }).join('');
    const avg = avgEvery && avgEvery >= 1 ? `<line class="avg" x1="${L}" x2="${W-R}" y1="${Y(avgEvery).toFixed(1)}" y2="${Y(avgEvery).toFixed(1)}"/>` : '';
    return `<div class="chart"><div class="ct"><b>구매 간격</b><span>${avgEvery && avgEvery >= 1 ? '평균선 ' + Math.round(avgEvery) + '일' : ''}</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="구매 간격">${grid}${avg}${bars}</svg></div>`;
  }

  function renderStats(now){
    document.querySelectorAll('.tab[data-smode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.smode === statsMode)));
    let html = '';
    for (const {it, e} of sortedVisible(now, false)){
      const s = statsOf(it);
      const unit = esc(it.unit || '개');
      const all = buysOf(it);
      // 각 구매에 단가·평균 대비·이전 구매와의 간격을 붙인다.
      const rows = all.map((b, i) => {
        const per = b.price > 0 && b.qty > 0 ? b.price / b.qty : null;
        const delta = per && s.avgPer ? (per - s.avgPer) / s.avgPer : null;
        const gap = i > 0 ? (Date.parse(b.at) - Date.parse(all[i-1].at)) / DAY : null;
        return {b, per, delta, gap};
      });
      const last = rows.length ? rows[rows.length-1] : null;
      const pricedCount = rows.filter(r => r.per).length;
      const deltaText = d => d == null ? '' : Math.abs(d) < 0.01 ? '보통과 같음' : (d > 0 ? '+' : '−') + Math.round(Math.abs(d) * 100) + '% ' + (d > 0 ? '비싸게' : '싸게');
      const deltaCls = d => d == null || Math.abs(d) < 0.01 ? '' : d > 0 ? 'up' : 'down';
      const pers = rows.filter(r => r.per).map(r => r.per);
      const range = pers.length >= 2 ? unit + '당 ' + fmtWon(Math.min(...pers)) + '~' + fmtWon(Math.max(...pers)) : '';
      const stat = (k, v, sub, cls) => `<div class="stat"><div class="k">${k}</div><div class="v ${cls || ''}">${v}${sub ? `<small>${sub}</small>` : ''}</div></div>`;
      const buys = rows.slice(-6).reverse();
      const head = `<div class="stat-head"><h2>${esc(it.name)}</h2>${faceImg(it.owner)}</div>`;
      if (statsMode === 'chart'){
        const charts = priceChart(rows, unit, s.avgPer) + gapChart(rows, s.every);
        html += `<section class="card">${head}${charts || `<div class="buys"><li>가격을 넣은 구매가 두 번 넘으면 그래프가 그려져요.</li></div>`}</section>`;
        continue;
      }
      html += `<section class="card">
        ${head}
        <div class="stat-grid">
          ${stat('보통 이 가격에 샀어요', s.avgPer ? unit + '당 ' + fmtWon(s.avgPer) : '—', s.avgPer ? (range || '평균 ' + fmtWon(s.avgPrice)) : (s.count ? '가격 기록 없음' : ''))}
          ${stat('최근엔 이 가격에', last && last.per ? unit + '당 ' + fmtWon(last.per) : '—', last && last.per ? (pricedCount >= 2 ? deltaText(last.delta) : '비교할 지난 가격이 없어요') : '', last ? deltaCls(pricedCount >= 2 ? last.delta : null) : '')}
          ${stat('이만큼 자주 사요', fmtEvery(s.every) || '—', last && last.gap != null && last.gap >= 1 ? '최근은 ' + Math.round(last.gap) + '일 만에' : (s.count < 2 ? '두 번 사면 계산돼요' : '같은 날 산 건 빼고요'))}
          ${stat('한 번에 이만큼', s.avgQty ? fmtQty(s.avgQty) + unit : '—', s.count ? '구매 ' + s.count + '회 · ' + rateText(it) : rateText(it))}
        </div>
        ${buys.length ? `<ul class="buys">${buys.map(({b, per, delta, gap}) => `<li>
            <span>${fmtDate(b.at)} · ${b.shop ? SHOP_NAME[b.shop] || b.shop : '—'} · ${fmtQty(b.qty)}${unit}${b.by && OWNER[b.by] ? ` · ${faceImg(b.by).replace('width="26" height="26"', 'width="18" height="18"')}` : ''}${gap != null && gap >= 1 ? ` <em>${Math.round(gap)}일 만에</em>` : ''}</span>
            <span>${b.price ? fmtWon(b.price) + (per ? ` <em>${unit}당 ${fmtWon(per)}</em>` : '') : ''}${delta != null && pricedCount >= 2 ? ` <b class="${deltaCls(delta)}">${delta > 0 ? '▲' : delta < 0 ? '▼' : '='}${Math.abs(delta) >= 0.01 ? Math.round(Math.abs(delta) * 100) + '%' : ''}</b>` : ''}</span>
          </li>`).join('')}</ul>` : `<div class="buys"><li>아직 구매 기록이 없어요. [구매]로 넣으면 쌓여요.</li></div>`}
      </section>`;
    }
    if (!html) html = `<div class="card"><div class="empty">품목이 없습니다.</div></div>`;
    statsEl.innerHTML = html;
  }

  const FIELD_LABEL = { name:'이름', owner:'누가 먹어요?', unit:'세는 단위', rateMode:'얼마나 먹어요?', rate:'하루에 먹는 양', daysPer:'한 개가 가는 날', leadDays:'주문 알림', shops:'어디서 사요?', links:'상품 링크', delete:'삭제' };
  function renderSettings(now){
    const it = mode === 'edit' || mode === 'field' ? items.find(x => x.id === openId) : null;
    if (it){ if (!editDraft) editDraft = clean(it); settingsEl.className = 'editpage'; settingsEl.innerHTML = renderEditPage({id: it.id, ...editDraft}); return; }
    settingsEl.className = 'settingswrap';
    const meCard = `<div class="card mecard"><div class="me-t"><b>이 폰은 누구 거예요?</b><span class="meta">뭉이 것을 살 때 자동으로 골라져요</span></div><div class="faces small">${['mom','dad'].map(k => `<button class="face-pick ${(buyBy || '') === k ? 'on' : ''}" type="button" data-act="pickby" data-val="${k}" aria-pressed="${(buyBy || '') === k}"><img src="${(document.querySelector('.tab.icon[data-owner=' + k + '] img') || {}).src || ''}" alt="${OWNER[k]}"><span>${OWNER[k]}</span></button>`).join('')}</div></div>`;
    let html = '';
    const visible = items.filter(it => owner === 'all' || (it.owner || 'me') === owner);
    for (const it of visible.slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''))){
      html += `<div class="row" data-id="${it.id}">
        <button class="row-head simple" type="button" data-act="toggle">
          <div>
            <div class="name">${esc(it.name)}${OWNER[it.owner] ? faceImg(it.owner) : '<span class="badge outline" style="font-weight:500">먹는 사람 미정</span>'}</div>
            <div class="meta">${shopLabel(it)} · ${rateText(it)}</div>
          </div>
          <span class="chev">›</span>
        </button>
      </div>`;
    }
    if (!html) html = `<div class="empty">표시할 품목이 없습니다.</div>`;
    settingsEl.innerHTML = meCard + `<div class="card">${html}</div>`;
  }
  function renderEditPage(it){
    const u = esc(it.unit || '개');
    const row = (key, val) => `<button class="gr" type="button" data-act="field" data-key="${key}"><span>${FIELD_LABEL[key]}</span><span class="v">${val}<i>›</i></span></button>`;
    const ownerVal = OWNER[it.owner] ? `${faceImg(it.owner)} ${OWNER[it.owner]}` : '아직 없음';
    const rateRow = it.rateMode === 'daysPer' ? row('daysPer', fmtRate(it.daysPer || 0) + '일') : row('rate', fmtRate(Number(it.dailyRate) || 0) + u);
    const links = (it.candidates || []).filter(c => c.url).length;
    return `<div class="grp"><div class="gt">기본</div>${row('name', esc(it.name))}${row('owner', ownerVal)}${row('unit', u)}</div>
      <div class="grp"><div class="gt">먹는 양</div>${row('rateMode', it.rateMode === 'daysPer' ? esc(josa('한 ' + (it.unit || '개'), '이', '가')) + ' 며칠 가요' : '하루에 몇 ' + u)}${rateRow}${row('leadDays', (it.leadDays ?? 3) + '일 전')}</div>
      <div class="grp"><div class="gt">사는 곳</div>${row('shops', esc(shopLabel(it)))}${row('links', links ? links + '개' : '없음')}</div>`;
  }
  const faceBtn = (k, on) => `<button class="face-pick ${on ? 'on' : ''}" type="button" data-act="pick" data-key="owner" data-val="${k}" aria-pressed="${on}"><img src="${(document.querySelector('.tab.icon[data-owner=' + k + '] img') || {}).src || ''}" alt="${OWNER[k]}"><span>${OWNER[k]}</span></button>`;
  const shopChip = (k, on) => `<button class="chip2 ${on ? 'on' : ''}" type="button" data-act="pickshop" data-val="${k}" aria-pressed="${on}">${SHOP_NAME[k]}</button>`;
  const segBtn = (key, val, label, on) => `<button class="segb ${on ? 'on' : ''}" type="button" data-act="pick" data-key="${key}" data-val="${val}" aria-pressed="${on}">${label}</button>`;
  const stepper = (id, val, step, min, suffix) => `<div class="stepper2"><button class="stp" type="button" data-act="step" data-target="#${id}" data-delta="${-step}" aria-label="줄이기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 12.1c4-.2 8-.2 12 0"/></svg></button><input class="input fi" type="number" inputmode="decimal" id="${id}" value="${val}" min="${min}" step="${step}"><button class="stp" type="button" data-act="step" data-target="#${id}" data-delta="${step}" aria-label="늘리기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 6c.15 4 .15 8 0 12"/><path d="M6 12.1c4-.2 8-.2 12 0"/></svg></button>${suffix ? `<span class="fl" style="margin:0 0 0 4px">${suffix}</span>` : ''}</div>`;

  // 필드 편집 시트(B의 한 줄)
  const unitChips = (cur) => `<div class="chips">${['개','팩','봉','병','캔','통'].map(x => `<button class="chip2 ${cur === x ? 'on' : ''}" type="button" data-act="unitpick" data-val="${x}">${x}</button>`).join('')}</div>`;
  function linkInputs(list){
    const rows = (list && list.length ? list : [{url:''}]).map((c, i) => `<div class="linkrow"><input class="input fi" type="url" inputmode="url" data-link="${i}" value="${esc(c.url || '')}" placeholder="상품 주소 붙여 넣기"><button class="stp" type="button" data-act="link-del" data-i="${i}" aria-label="지우기">×</button></div>`).join('');
    return `<div class="links" id="fv-links">${rows}</div><button class="btn outline sm" type="button" data-act="link-add">+ 링크 추가</button>`;
  }
  function renderField(it, key){
    const u = esc(it.unit || '개');
    const save = `<div class="fbtn"><button class="btn outline" type="button" data-act="cancel">취소</button><button class="btn primary" type="button" data-act="field-save">확인</button></div>`;
    switch (key){
      case 'name': return `<div class="sform"><input class="input fi" type="text" id="fv" value="${esc(it.name)}" data-autofocus>${save}</div>`;
      case 'unit': return `<div class="sform"><span class="fl">고르거나 직접 써도 돼요</span>${unitChips(it.unit || '개')}<input class="input fi" type="text" id="fv" value="${u}" placeholder="예: 봉지">${save}</div>`;
      case 'owner': return `<div class="sform"><div class="faces">${['mom','dad','mung'].map(k => faceBtn(k, it.owner === k)).join('')}</div></div>`;
      case 'rateMode': return `<div class="sform"><div class="seg">${segBtn('rateMode','perDay','하루에 몇 ' + u, it.rateMode !== 'daysPer')}${segBtn('rateMode','daysPer', esc(josa('한 ' + (it.unit || '개'), '이', '가')) + ' 며칠', it.rateMode === 'daysPer')}</div></div>`;
      case 'rate': return `<div class="sform"><div class="fg"><span class="fl">하루에 이만큼 먹어요 <em>평일 하루 1${u} = 0.71</em></span>${stepper('fv', fmtRate(Number(it.dailyRate) || 0.71), 0.1, 0, u)}</div>${save}</div>`;
      case 'daysPer': return `<div class="sform"><div class="fg"><span class="fl">${esc(josa('한 ' + (it.unit || '개'), '이', '가'))} 며칠 가요 <em>개수를 몰라도 돼요</em></span>${stepper('fv', fmtRate(it.daysPer || 6), 0.5, 0.5, '일')}</div>${save}</div>`;
      case 'leadDays': return `<div class="sform"><div class="fg"><span class="fl">떨어지기 며칠 전에 알려 드릴까요?</span>${stepper('fv', it.leadDays ?? 3, 1, 0, '일 전')}</div>${save}</div>`;
      case 'shops': return `<div class="sform"><span class="fl">여러 곳이면 여러 개 골라요</span><div class="chips" id="fv-shops">${SHOP_KEYS.map(k => shopChip(k, shopKeys(it).includes(k))).join('')}</div>${save}</div>`;
      case 'links': return `<div class="sform"><span class="fl">사는 상품 주소를 넣어 두면 [열기]로 바로 가요</span>${linkInputs((it.candidates || []).filter(c => c.url))}${save}</div>`;

  // 품목 추가(C 단계형) — 1~4 품목 정보, 5 구매 정보(건너뛸 수 있음)

      <div class="seg" style="margin-bottom:12px">${segBtn('rateMode','perDay','하루에 몇 ' + u, d.rateMode !== 'daysPer')}${segBtn('rateMode','daysPer', esc(josa('한 ' + (d.unit || '개'), '이', '가')) + ' 며칠', d.rateMode === 'daysPer')}</div>
      ${d.rateMode === 'daysPer' ? stepper('n-rate', fmtRate(d.daysPer), 0.5, 0.5, '') : stepper('n-rate', fmtRate(d.dailyRate), 0.1, 0, '')}`, false);

  // 추가 초안 → 저장할 문서
  function newDoc(){
    const doc = { name: draft.name, owner: draft.owner, shops: draft.shops.slice(), unit: draft.unit, rateMode: draft.rateMode, leadDays: draft.leadDays, candidates: [], baseQty: null, baseAt: null, history: [] };
    doc.shop = doc.shops.length === 1 && doc.shops[0] === 'kurly' ? 'kurly' : doc.shops.length === 1 && doc.shops[0] === 'naver' ? 'smartstore' : 'both';
    if (draft.rateMode === 'daysPer'){ doc.daysPer = draft.daysPer; doc.dailyRate = Math.round((1 / draft.daysPer) * 1000) / 1000; } else { doc.dailyRate = draft.dailyRate; }
    return doc;
  }

  // ---------- actions ----------

  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), 1800); }
  function pushHist(it, ev){ const h = (it.history || []).slice(-59); h.push(ev); return h; }
  function clean(it){ const {id, ...doc} = it; return JSON.parse(JSON.stringify(doc)); }

  // 수정 = 실물 카운트. 구매가 아니라 "먹은 양이 달랐다"는 정보 → 소비율 학습.
  async function doCount(it, n, now){
    const e = estimate(it, now);
    const doc = clean(it);
    const at = new Date(now).toISOString();
    let learned = null;
    if (e && e.days >= 3 && it.baseQty != null){
      const observed = (it.baseQty - n) / e.days;
      if (observed > 0){
        learned = Math.round(((Number(it.dailyRate) || observed) * 0.5 + observed * 0.5) * 100) / 100;
        doc.dailyRate = learned;
        if (doc.rateMode === 'daysPer') doc.daysPer = Math.round((1 / learned) * 10) / 10;
      }
    }
    doc.baseQty = n; doc.baseAt = at;
    doc.history = pushHist(it, {at, type: 'count', qty: n, rate: learned});
    await save(it.id, doc);
    const u = it.unit || '개';
    toast(learned != null ? `${it.name} ${fmtQty(n)}${u}. 소비량을 다시 잡았습니다` : `${it.name} ${fmtQty(n)}${u}로 고쳤습니다`);
  }
  // 구매 = 채움. 수량을 더하고 가격·판매처를 기록. it은 저장된 품목이거나 새로 만들 문서
  function buyDoc(it, qty, price, shop, now, boughtAt, by){
    const e = estimate(it, now);
    const doc = clean(it);
    const nowIso = new Date(now).toISOString();
    const when = boughtAt && boughtAt < now ? boughtAt : now;
    // 과거 날짜면 그 뒤로 먹은 만큼은 이미 추정에서 빠졌다고 보고, 산 수량에서 그만큼 뺀다.
    const eaten = (now - when) / DAY * (Number(it.dailyRate) || 0);
    doc.baseQty = Math.max(0, Math.round(((e ? e.est : 0) + qty - eaten) * 10) / 10); doc.baseAt = nowIso;
    const at = new Date(when).toISOString();
    doc.lastBuyAt = at;
    const h = (it.history || []).slice(-59); const ev = {at, type: 'buy', qty, price: price || null, shop}; if (by) ev.by = by; h.push(ev);
    h.sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
    doc.history = h;
    return doc;
  }
  async function doBuy(it, qty, price, shop, now, boughtAt, by){

  // ---------- pull to reload: 화면이 따라 내려오고, 놓으면 페이지를 다시 불러옴 ----------
  (function(){
    const ptr = $('#ptr'); const page = document.querySelector('.container'); if (!ptr || !page) return;
    const MAX = 110, ARM = 70; let startY = null, pulling = false, dy = 0, busy = false;
    function place(d, animate){
      page.style.transition = animate ? 'transform .25s ease-out' : 'none';
      ptr.style.transition = animate ? 'transform .25s ease-out, opacity .2s' : 'none';
      page.style.transform = d ? `translateY(${d}px)` : '';
      ptr.style.transform = `translate(-50%, ${d - 44}px) rotate(${d * 3}deg)`;
      ptr.style.opacity = String(Math.min(1, d / 28));
    }
    document.addEventListener('touchstart', ev => {
      if (busy || !$('#sheet').hidden) { startY = null; return; }
      startY = window.scrollY <= 0 ? ev.touches[0].clientY : null; pulling = false; dy = 0;
    }, {passive: true});
    document.addEventListener('touchmove', ev => {
      if (startY == null || busy) return;
      const d = ev.touches[0].clientY - startY;
      if (d > 6 && window.scrollY <= 0){ pulling = true; dy = Math.min(MAX, d * 0.55); place(dy, false); if (ev.cancelable) ev.preventDefault(); }
      else if (pulling && d <= 0){ pulling = false; dy = 0; place(0, false); }
    }, {passive: false});
    document.addEventListener('touchend', () => {
      if (startY == null) return;
      const armed = pulling && dy >= ARM * 0.55;
      startY = null; pulling = false;
      if (armed){ busy = true; ptr.classList.add('spin'); place(56, true); ptr.style.transform = 'translate(-50%, 12px)'; setTimeout(() => location.reload(), 350); }
      else place(0, true);
      dy = 0;
    }, {passive: true});
  })();

  (function(){

    let sx = null, sy = null, tracking = false;
    document.addEventListener('touchstart', ev => {
      if (!$('#sheet').hidden || (mode === 'edit' || mode === 'field')) { sx = null; return; }
      const t = ev.touches[0]; sx = t.clientX; sy = t.clientY; tracking = true;
    }, {passive: true});
    document.addEventListener('touchmove', ev => {
      if (sx == null || !tracking) return;
      const t = ev.touches[0]; const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10) tracking = false;   // 세로 스크롤이면 포기
    }, {passive: true});
    document.addEventListener('touchend', ev => {
      if (sx == null || !tracking) { sx = null; return; }
      const t = ev.changedTouches[0]; const dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
      if (Math.abs(dx) < 60 || Math.abs(dy) > 50) return;
      const i = ORDER.indexOf(view); const next = ORDER[i + (dx < 0 ? 1 : -1)]; if (!next) return;
      const page = document.querySelector('.container');
      page.classList.remove('slide-l', 'slide-r'); void page.offsetWidth;
      page.classList.add(dx < 0 ? 'slide-l' : 'slide-r');
      const cur = items.find(x => x.id === openId);
      if (cur && editDraft && JSON.stringify(editDraft) !== JSON.stringify(clean(cur))){ save(cur.id, editDraft).then(() => toast('저장했습니다')).catch(console.error); }
      editDraft = null; view = next; openId = null; mode = null; confirmDelete = false; render(); window.scrollTo({top: 0});
    }, {passive: true});
  })();

  // ---------- boot ----------
  items = lsLoad();
  render();
  setInterval(render, 10 * 60 * 1000);

  const loginEl = $('#login'), loginMsg = $('#login-msg');
  function showLogin(msg){ loginEl.hidden = false; if (msg) loginMsg.textContent = msg; }
  function hideLogin(){ loginEl.hidden = true; }
  $('#login-google').addEventListener('click', async () => {
    loginMsg.textContent = 'Google로 이동합니다…';
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
    if (error) loginMsg.textContent = 'Google 로그인을 시작하지 못했습니다. Supabase에서 Google 제공자를 켰는지 확인해 주세요.';
  });
  $('#login-send').addEventListener('click', async () => {
    const email = $('#login-email').value.trim(); if (!email) { $('#login-email').focus(); return; }
    loginMsg.textContent = '보내는 중…';
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error){ loginMsg.textContent = '보내지 못했습니다. 이메일을 확인해 주세요.'; return; }
    loginMsg.textContent = '메일함에서 로그인 링크를 눌러 주세요. 링크를 누르면 바로 열려요.';
  });

  (async () => {
    const cfg = window.MOONG_CONFIG || {};
    if (!cfg.url || !cfg.key || !window.supabase){ $('#footnote').textContent = '이 기기에만 저장됩니다.'; return; }
    sb = window.supabase.createClient(cfg.url, cfg.key);
    window.__fetchPrice = async (url) => { const { data, error } = await sb.functions.invoke('price', { body: { url } }); if (error) throw error; return data; };
    window.__savePrices = async (id, doc) => { const { error } = await sb.from('prices').upsert({ id, data: doc, updated_at: new Date().toISOString() }); if (error) throw error; };
    async function start(){
      hideLogin();
      try { await loadAll(); } catch (e) { console.error(e); $('#footnote').textContent = '저장소에 연결하지 못했습니다.'; return; }
      sb.channel('moong').on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, () => loadAll().catch(console.error))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'prices' }, () => loadAll().catch(console.error)).subscribe();
      document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll().catch(console.error); });
    }
    // 구글에서 돌아올 때 주소에 실린 에러(#error_description=… / ?error=…)를 로그인 화면에 보여 준다
    let authErr = '';
    try {
      const h = new URLSearchParams(location.hash.replace(/^#/, '')), q = new URLSearchParams(location.search);
      const code = h.get('error_code') || h.get('error') || q.get('error_code') || q.get('error') || '';
      const desc = h.get('error_description') || q.get('error_description') || '';
      if (code || desc){
        const d = decodeURIComponent(desc.replace(/\+/g, ' '));
        authErr = /signup/i.test(code + d) ? '이 계정은 아직 허용되지 않았어요. 뭉맘에게 이메일을 알려 주세요. (' + d + ')' : '로그인이 안 됐어요: ' + (d || code);
        history.replaceState(null, '', location.pathname);
      }
    } catch(e){}
    const { data: { session } } = await sb.auth.getSession();
    if (session) start(); else showLogin(authErr);
    sb.auth.onAuthStateChange((ev, sess) => { if (ev === 'SIGNED_IN' && sess && loginEl.hidden === false) start(); if (ev === 'SIGNED_OUT') showLogin(''); });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  })();
})();
</script>
</body>
</html>
